<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adonias Daniel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 90%, #0758d0, transparent 35%),
        radial-gradient(circle at 85% 10%, #db2985, transparent 38%),
        linear-gradient(135deg, #182b72, #6d2e82 50%, #a82973);
    }

    .card {
      width: 390px;
      min-height: 650px;
      position: relative;
      overflow: hidden;
      border-radius: 27px;
      border: 1px solid rgba(255,255,255,.35);
      background:
        linear-gradient(180deg, #17275f 0%, #10183b 48%, #080d27 100%);
      box-shadow:
        0 25px 50px rgba(0,0,0,.45),
        inset 0 1px 1px rgba(255,255,255,.2);
      transition: .45s ease;
      cursor: pointer;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 570px;
      height: 400px;
      top: -110px;
      left: -110px;
      background: linear-gradient(
        135deg,
        #ff3297,
        #a33bd8 48%,
        #1688ed
      );
      border-radius: 45% 55% 55% 35%;
      transform: rotate(-10deg);
      transition: .45s ease;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 540px;
      height: 260px;
      top: 210px;
      left: -90px;
      background: #111842;
      border-radius: 50% 50% 0 0;
      transform: rotate(-8deg);
      transition: .45s ease;
    }

    .menu {
      position: absolute;
      z-index: 10;
      top: 27px;
      right: 27px;
      color: white;
      font-size: 29px;
      line-height: 9px;
      letter-spacing: 3px;
    }

    .avatar {
      width: 215px;
      height: 215px;
      position: relative;
      z-index: 5;
      margin: 58px auto 22px;
      border-radius: 50%;
      overflow: hidden;
      border: 6px solid transparent;
      background:
        linear-gradient(#14203f, #14203f) padding-box,
        linear-gradient(
          135deg,
          #ff78cd,
          #b466ff,
          #4faaff
        ) border-box;
      box-shadow:
        0 0 25px rgba(219,82,255,.4);
      transition: .45s ease;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content {
      position: relative;
      z-index: 7;
      text-align: center;
      padding: 0 38px 30px;
    }

    h1 {
      color: white;
      font-size: 36px;
      line-height: 1.1;
      margin-bottom: 7px;
    }

    .role {
      color: #ef69cf;
      font-size: 21px;
      margin-bottom: 25px;
    }

    .description {
      color: #d2d7eb;
      font-size: 19px;
      line-height: 1.6;
      margin-bottom: 23px;
    }

    .line {
      width: 88%;
      height: 1px;
      margin: 0 auto 22px;
      background: rgba(255,255,255,.2);
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 32px;
    }

    .social {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 21px;
      font-weight: bold;
      background: rgba(25,55,125,.85);
      border: 1px solid rgba(100,160,255,.35);
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }

    .instagram {
      background: linear-gradient(135deg, #5334d5, #ee3c91);
    }

    .details {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(15px);
      margin-bottom: 0;
      text-align: left;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 16px;
      background: rgba(23,31,70,.75);
      transition:
        max-height .45s ease,
        opacity .35s ease,
        transform .45s ease,
        margin .45s ease;
    }

    .detail {
      display: flex;
      align-items: center;
      gap: 17px;
      padding: 15px 18px;
      border-bottom: 1px solid rgba(255,255,255,.13);
    }

    .detail:last-child {
      border-bottom: none;
    }

    .detail-icon {
      width: 30px;
      color: #e34cc8;
      font-size: 24px;
      text-align: center;
    }

    .detail strong {
      display: block;
      color: white;
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 3px;
    }

    .detail span {
      color: #c4c9dd;
      font-size: 14px;
    }

    .button {
      width: 285px;
      max-width: 100%;
      height: 66px;
      margin: auto;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      background: linear-gradient(
        90deg,
        #f72f9a,
        #a642d7,
        #267ce9
      );
      box-shadow: 0 8px 20px rgba(63,66,240,.35);
      transition: .35s ease;
    }

    .card:hover {
      transform: translateY(-15px) scale(1.015);
      box-shadow:
        0 30px 60px rgba(0,0,0,.55),
        0 0 40px rgba(173,61,255,.22);
    }

    .card:hover .avatar {
      width: 315px;
      height: 315px;
      margin-top: 27px;
    }

    .card:hover .details {
      max-height: 230px;
      opacity: 1;
      transform: translateY(0);
      margin-bottom: 25px;
    }

    .card:hover .button {
      box-shadow:
        0 10px 25px rgba(50,100,255,.45);
    }

    @media (max-width: 500px) {
      body {
        padding: 25px 15px;
      }

      .card {
        width: min(390px, 94vw);
        min-height: 620px;
      }

      .card:hover .avatar {
        width: 270px;
        height: 270px;
      }

      h1 {
        font-size: 31px;
      }

      .description {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="menu">
      •<br>
      •<br>
      •
    </div>

    <div class="avatar">
      <img src="me.jpg" alt="Adonias Daniel">
    </div>

    <div class="content">

      <h1>Adonias Daniel</h1>

      <div class="role">
        Frontend Developer
      </div>

      <p class="description">
        I build beautiful, responsive and
        user-friendly websites.
      </p>

      <div class="line"></div>

      <div class="socials">
        <div class="social">f</div>
        <div class="social">♥</div>
        <div class="social">in</div>
        <div class="social">●</div>
        <div class="social instagram">◎</div>
      </div>

      <div class="details">

        <div class="detail">
          <div class="detail-icon">▣</div>
          <div>
            <strong>Joined</strong>
            <span>January 2023</span>
          </div>
        </div>

        <div class="detail">
          <div class="detail-icon">⌖</div>
          <div>
            <strong>Location</strong>
            <span>Adama, Ethiopia</span>
          </div>
        </div>

        <div class="detail">
          <div class="detail-icon">✉</div>
          <div>
            <strong>Email</strong>
            <span>adonias@example.com</span>
          </div>
        </div>

      </div>

      <div class="button">
        <span class="normal-text">View Profile</span>
        <span class="hover-text">Contact Me</span>
      </div>

    </div>

  </div>

  

</body>
</html>
